name: Governance Core Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python proposal_manager.py
      - run: python vote_tracker.py
      - run: python -m pip install bandit==1.7.10 ruff==0.8.4
      - run: ruff check .
      - run: bandit -r . -x ./.git
      - name: Explicit execution guard
        run: test "$(python -c 'import json; print(json.load(open("governance.config.example.json"))["execution"]["enabled"])')" = "False"
